services:
  db:
    image: postgres:17-alpine
    container_name: letterbox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-letterbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-letterbox}
      POSTGRES_DB: ${POSTGRES_DB:-letterbox}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
