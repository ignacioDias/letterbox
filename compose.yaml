services:
  app:
    build:
      context: .
    container_name: letterbox-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-letterbox}:${POSTGRES_PASSWORD:-letterbox}@db:5432/${POSTGRES_DB:-letterbox}?sslmode=disable
      VALKEY_HOST: valkey
      VALKEY_PORT: 6379
      VALKEY_USE_TLS: ${VALKEY_USE_TLS:-false}
      VALKEY_DATABASE_ID: ${VALKEY_DATABASE_ID:-0}
      PORT: 8080
      APP_ENV: ${APP_ENV:-development}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"

  valkey:
    image: valkey/valkey:8-alpine
    container_name: letterbox-valkey
    restart: unless-stopped
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  db:
    image: postgres:17-alpine
    container_name: letterbox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-letterbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-letterbox}
      POSTGRES_DB: ${POSTGRES_DB:-letterbox}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
  valkey_data:
